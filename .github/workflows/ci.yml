name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Build web app (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  java:
    name: Test Java JD-match service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-match-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: mvn -B test
